name: Build CasinoCraft

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # This project does not yet contain gradlew or gradle-wrapper.jar.
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build Fabric mod
        run: gradle --no-daemon build

      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CasinoCraft-26.3-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
